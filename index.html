<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome to DOM Manipulation</h1>
    <p>Click the button below to interact with the DOM.</p>
  </header>

  <main>
    <button id="changeTextBtn">Change Text</button>
    <button id="changeStyleBtn">Change Style</button>
    <button id="toggleElementBtn">Toggle Element</button>

    <div id="newElement" style="display:none;">
      <p>This is a dynamically added element!</p>
    </div>
  </main>

  <footer>
    <p>Created as a JavaScript DOM manipulation exercise.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
